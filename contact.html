<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Janiru Hansaga</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- GSAP Animation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>

<body>

    <!-- Custom Desktop Cursor -->
    <div class="custom-cursor" id="custom-cursor">
        <div class="cursor-dot"></div>
        <div class="cursor-ring"></div>
        <span class="cursor-text" id="cursor-text"></span>
    </div>

    <main id="main-content">

        <section class="contact-section" style="padding-top: 140px;">
            <div class="section-container">
                <span class="section-tag">GET IN TOUCH</span>
                
                <div class="contact-container">
                    <div class="contact-info reveal-on-scroll">
                        <h2>LET'S TALK.</h2>
                        <p>Whether you have a question about my AI projects, want to collaborate on a web app, or just want to say hi, my inbox is always open.</p>

                        <div class="info-item">
                            <i class="fa-solid fa-envelope"></i>
                            <span style="word-break: break-all;">janiruhansagaperera2027@gmail.com</span>
                        </div>

                        <div class="info-item">
                            <i class="fa-solid fa-location-dot"></i>
                            <span>Colombo, Sri Lanka</span>
                        </div>

                        <div style="margin-top: 36px;">
                            <span class="section-tag" style="font-size: 0.75rem;">CONNECT ON SOCIAL</span>
                            <div class="social-icons" style="display: flex; gap: 16px; margin-top: 12px;">
                                <a href="https://www.tiktok.com/@ceylonedits.lk" class="social-hacker-link cursor-hover-trigger" target="_blank" title="TikTok" data-cursor="TIKTOK">
                                    <i class="fa-brands fa-tiktok"></i>
                                </a>
                                <a href="https://www.facebook.com/janiruofficial" class="social-hacker-link cursor-hover-trigger" target="_blank" title="Facebook" data-cursor="FB">
                                    <i class="fa-brands fa-facebook-f"></i>
                                </a>
                                <a href="https://www.instagram.com/janiruofficial/" class="social-hacker-link cursor-hover-trigger" target="_blank" title="Instagram" data-cursor="IG">
                                    <i class="fa-brands fa-instagram"></i>
                                </a>
                                <a href="https://whatsapp.com/channel/0029VbBx2Y75kg7DlgHl8109" class="social-hacker-link cursor-hover-trigger" target="_blank" title="WhatsApp Channel" data-cursor="WA">
                                    <i class="fa-brands fa-whatsapp"></i>
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="contact-form reveal-on-scroll">
                        <h3>SEND A MESSAGE</h3>

                        <form action="https://formspree.io/f/mpwgnygb" method="POST">
                            <div class="form-group">
                                <label>Your Name</label>
                                <input type="text" name="name" class="form-input" placeholder="Your Name" required>
                            </div>

                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" name="email" class="form-input" placeholder="Your Email" required>
                            </div>

                            <div class="form-group">
                                <label>Message</label>
                                <textarea name="message" class="form-input" rows="5" placeholder="Write your message..." required></textarea>
                            </div>

                            <button type="submit" class="btn cursor-hover-trigger" data-cursor="SEND" style="width: 100%;">Send Message <i class="fa-solid fa-paper-plane"></i></button>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <script src="music.js"></script>
        <script src="hero-animation.js"></script>
    </main>

    <script src="components.js"></script>
</body>

</html>
