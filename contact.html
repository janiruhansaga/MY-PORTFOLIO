<main id="main-content">


    

    <section class="contact-section">
        <div class="contact-container">

            <div class="contact-info">
                <div>
                    <h2>Let's Talk</h2>
                    <p>Whether you have a question about my AI projects, want to collaborate on a web app, or just want
                        to say hi, my inbox is always open.</p>

                    <div class="info-item">
                        <i class="fa-solid fa-envelope"></i>
                        <span style="font-size: 0.9rem; word-break: break-all;">janiruhansagaperera2027@gmail.com</span>
                    </div>

                    <div class="info-item">
                        <i class="fa-solid fa-location-dot"></i>
                        <span>Colombo, Sri Lanka</span>
                    </div>
                </div>

                <div class="social-icons" style="display: flex; gap: 20px; margin-top: 20px;">
                    <a href="https://www.tiktok.com/@ceylonedits.lk" class="social-hacker-link" target="_blank" title="TikTok">
                        <i class="fa-brands fa-tiktok"></i>
                    </a>
                    <a href="https://www.facebook.com/janiruofficial" class="social-hacker-link" target="_blank" title="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                    <a href="https://www.instagram.com/janiruofficial/" class="social-hacker-link" target="_blank" title="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://whatsapp.com/channel/0029VbBx2Y75kg7DlgHl8109" class="social-hacker-link" target="_blank" title="WhatsApp Channel">
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>
                </div>
            </div>

            <div class="contact-form">
                <h3>Send a Message</h3>

                <form action="https://formspree.io/f/mpwgnygb" method="POST">

                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" name="name" class="form-input" placeholder="Your Name" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" class="form-input" placeholder="Your Email" required>
                    </div>

                    <div class="form-group">
                        <label>Message</label>
                        <textarea name="message" class="form-input" rows="5" placeholder="Write your message..."
                            required></textarea>
                    </div>

                    <button type="submit" class="btn" style="width: 100%;">Send Message</button>
                </form>
            </div>

        </div>
    </section>
    
    <script>
        // Dark Mode Logic
        const toggleSwitch = document.querySelector('#checkbox');
        const currentTheme = localStorage.getItem('theme');

        if (currentTheme) {
            document.body.classList.add(currentTheme);
            if (currentTheme === 'dark-mode') {
                toggleSwitch.checked = true;
            }
        }

        function switchTheme(e) {
            if (e.target.checked) {
                document.body.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('theme', 'light');
            }
        }
        toggleSwitch.addEventListener('change', switchTheme, false);

        // Mobile Menu
        function toggleMenu() {
            const nav = document.getElementById("navLinks");
            nav.classList.toggle("active");

            const icon = document.querySelector(".hamburger i");
            if (nav.classList.contains("active")) {
                icon.classList.remove("fa-bars");
                icon.classList.add("fa-xmark");
            } else {
                icon.classList.remove("fa-xmark");
                icon.classList.add("fa-bars");
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="music.js"></script>
